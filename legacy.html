&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;header class=&quot;head&quot;&gt;&lt;h1&gt;春招转型计划&lt;/h1&gt;&lt;p class=&quot;text-muted&quot;&gt;2026.11.08 — 2027.03.31 · 22周 · 一次完成一周&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;pair&quot;&gt;&lt;section&gt;&lt;h3&gt;目标&lt;/h3&gt;&lt;p&gt;深圳国际研发 · AI应用全栈&lt;/p&gt;&lt;p class=&quot;text-muted&quot;&gt;保留资深前端优势，争取真实后端与AI生产经验。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;主线&lt;/h3&gt;&lt;p&gt;React / TS + Python / SQL&lt;/p&gt;&lt;p class=&quot;text-muted&quot;&gt;Node.js按JD补强；Go后置。工作日3小时、周末2小时；普通周19小时。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;hr&gt;
&lt;div class=&quot;weekbar&quot;&gt;&lt;div class=&quot;stack&quot;&gt;&lt;h2&gt;本周待办&lt;/h2&gt;&lt;p class=&quot;text-muted&quot; id=&quot;cr-dates&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;form-label&quot;&gt;周次&lt;select class=&quot;form-select&quot; id=&quot;cr-week&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;outcome&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;本周项目交付&lt;/span&gt;&lt;h3 id=&quot;cr-outcome&quot;&gt;&lt;/h3&gt;&lt;/div&gt;
&lt;p id=&quot;cr-count&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;section class=&quot;stack&quot;&gt;&lt;h2&gt;模块占比&lt;/h2&gt;&lt;div id=&quot;cr-allocation&quot; class=&quot;stack&quot;&gt;&lt;/div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;语言时间包括TS与Python；全栈做功能、AI做原理评测、项目做集成发布，不重复记账。正常周语言3小时，TS与Python各1.5小时。&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;div class=&quot;weekbar&quot;&gt;&lt;h2&gt;每天怎么安排&lt;/h2&gt;&lt;label class=&quot;form-label&quot;&gt;学习日&lt;select class=&quot;form-select&quot; id=&quot;cr-day&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;cr-day-summary&quot;&gt;&lt;/p&gt;&lt;div id=&quot;cr-daily&quot; class=&quot;stack&quot;&gt;&lt;/div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;午饭12:00—13:00；晚饭18:00—19:00。周日16:15—17:00去球场、17:00—18:00网球、18:00—18:45返程、18:45—19:30晚饭。往返各45分钟为暂估，可按实际调整。其他未排时间自由安排。完成即收工，参考时段不要求坐满。&lt;/p&gt;&lt;/section&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Python主线为什么会出现Node.js岗位&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;&lt;p&gt;学习主线仍为React/TS与Python/FastAPI：目标是有前端优势的AI应用全栈，而非纯Python资深后端。此前公开JD样本偏Node，不能据此证明Python在深圳更好找工作；这一点与推荐主次没有讲清。&lt;/p&gt;&lt;p&gt;主投画像：React/TS产品工程、允许承担Python模型服务、RAG或Agent模块的团队，以及接受前端转型经验的Python AI应用岗。当前没有足够已核实岗位支持把任何公司标成确定的Python主投。&lt;/p&gt;&lt;p&gt;EPAM的Node/React JD放入备选桥梁，不能算Python岗位；安克AI应用岗位需取得完整JD并确认语言与团队职责。只有明确排期的Node面试，或至少3家符合国际研发要求的团队有适配Node岗位时，才从原技术预算内调拨两周、每周4小时补Node；不同时学三套后端。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;本周过关练习与测试&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;&lt;p&gt;测试包含在模块预算内，替换部分看课时间；不用额外加班刷题。页面只记录自评，不冒充已自动执行你的代码。&lt;/p&gt;&lt;p&gt;TS：&lt;a href=&quot;https://www.typescriptlang.org/play/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;TS Playground&lt;/a&gt;开启strict，验证联合类型与收窄；为unknown输入覆盖null、缺字段、错类型、空标题和合法数据。不得用any或强行断言蒙混过关。&lt;/p&gt;&lt;p&gt;Python：完成clean_documents，测试正常输入、空输入、重复ID、空白标题、坏类型、输入不被修改和重复调用稳定。&lt;a href=&quot;practice-kit.zip&quot; target=&quot;_blank&quot;&gt;下载练习与测试包&lt;/a&gt;；包内有unittest用例，运行结果留作证据，再补一个自己的边界测试。&lt;a href=&quot;https://docs.pytest.org/en/stable/how-to/parametrize.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;后续迁移pytest参数化测试&lt;/a&gt;。&lt;/p&gt;&lt;p&gt;React：测受控输入、空结果、接口失败、请求乱序、取消后不更新；以后端/API集成和主流程E2E验证真实行为，不用覆盖率代替关键场景。&lt;/p&gt;&lt;p&gt;算法每周最多2题，每题25分钟：&lt;a href=&quot;https://leetcode.com/problems/two-sum/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Two Sum&lt;/a&gt;和&lt;a href=&quot;https://leetcode.com/problems/valid-parentheses/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Valid Parentheses&lt;/a&gt;。先独立写、再提交，48小时后闭卷复做；能解释复杂度和失败案例才算掌握。后续周从真实面试错题选，不每周重复这两题。&lt;/p&gt;&lt;p&gt;本周过关：TS校验、Python清洗和React表单均能独立完成；关键用例通过，保留测试输出或提交链接。点击“验收通过”仍需你实际核对。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;section class=&quot;stack&quot; aria-label=&quot;学习路径与直达入口&quot;&gt;&lt;h2&gt;先去这里学，再做下方练习&lt;/h2&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;每条路线只保留一个主教材；先做题暴露缺口，再查文档，当天用于项目。课程、社区和App都替换原学习时间，不额外加量。&lt;/p&gt;&lt;div class=&quot;stack&quot; id=&quot;cr-routes&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;hr&gt;&lt;div id=&quot;cr-tasks&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;text-small text-muted&quot; id=&quot;cr-save&quot; aria-live=&quot;polite&quot;&gt;启动周与第一个完整周已细拆。子任务全部勾选后自动记为已做；验收仍需成果证据。&lt;/p&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;社区、博客与App怎么用才不分心&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;h3&gt;社区用于带着问题拿反馈&lt;/h3&gt;&lt;p&gt;&lt;a href=&quot;https://www.reactiflux.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Reactiflux&lt;/a&gt;：React问题讨论；需要Discord时再决定是否加入，不要求为了学习安装新App。&lt;a href=&quot;https://github.com/fastapi/fastapi/discussions&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;FastAPI Discussions&lt;/a&gt;：先搜相同版本问题，再发最小复现、错误、预期和已尝试方案。回复不等于官方结论。&lt;/p&gt;&lt;p&gt;每周最多30分钟，优先解决项目阻碍；小红书、B站和YouTube只搜索具体问题及近期面试经验。代码结论以官方文档和可运行实验复核，不按点赞量换路线；不推荐未经核实的博主。&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;h3&gt;博客按需读，不订一堆资讯&lt;/h3&gt;&lt;p&gt;&lt;a href=&quot;https://realpython.com/learning-paths/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Real Python&lt;/a&gt;用于解释卡点；&lt;a href=&quot;https://martinfowler.com/articles/practical-test-pyramid.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;工程测试文章&lt;/a&gt;用于项目取舍。每周最多一篇，留一条可用于当前项目的改动；文章示例需要核对版本。&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;h3&gt;多邻国是可选补充，不是技术英语主线&lt;/h3&gt;&lt;p&gt;&lt;a href=&quot;https://blog.duolingo.com/how-duolingo-teaches-english/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;多邻国官方课程说明&lt;/a&gt;包含B1/B2英语内容，但内容覆盖不等于个人达到该水平，也不等于能完成工程协作。只有需要日常习惯或基础补缺时，安排每天5至10分钟，每周最多30分钟，替换原英语时间；跳过已会的内容，不追连胜和积分。&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://apps.ankiweb.net/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Anki&lt;/a&gt;仅在经常忘记同一表达时采用，每天5分钟、每周最多10张自己的工作句卡。多邻国与Anki先选一个，两周没有帮助就停；无需同时安装。&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;h3&gt;每周4小时英语如何分&lt;/h3&gt;&lt;p&gt;职场听力及文本60分钟；项目口述与模拟追问90分钟；英文issue或PR写作45分钟；错题、短语查证或可选App45分钟。共240分钟，均包含在周预算内；春节周按3小时执行。&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;stack&quot;&gt;&lt;h3&gt;两周后检验效率&lt;/h3&gt;&lt;p&gt;技术：闭卷实现一个React表单、一个TS输入校验和一个Python清洗函数，能解释并修复错误。英语：重录同一个项目讲解，能先讲结论并回答3个追问。若只完成课程进度却不能独立输出，减少课程与App时间，增加练习和反馈。以上为适配你的试行方案，不声称已证明是全局最高效。&lt;/p&gt;&lt;/section&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;阶段路线与长期目标&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;11月&lt;/span&gt;&lt;div&gt;&lt;h3&gt;补强基本盘&lt;/h3&gt;&lt;p&gt;React与TS、FastAPI、数据库，打通完整CRUD。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;12月&lt;/span&gt;&lt;div&gt;&lt;h3&gt;完成可靠的RAG&lt;/h3&gt;&lt;p&gt;检索基线、带来源问答、评测与Canvas证据视图。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;1月&lt;/span&gt;&lt;div&gt;&lt;h3&gt;形成求职作品&lt;/h3&gt;&lt;p&gt;工具调用、恢复、部署与双语演示；开始少量试投。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;2月至3月&lt;/span&gt;&lt;div&gt;&lt;h3&gt;定向求职&lt;/h3&gt;&lt;p&gt;春节两周各14小时；节后每周6至8份定制申请，按反馈补短板。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;2027年4至11月&lt;/span&gt;&lt;div&gt;&lt;h3&gt;积累真实生产经验&lt;/h3&gt;&lt;p&gt;入职后按30、60、90天承担模块与上线；尚未入职则继续投递并保留收入。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;phase&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;2027年12月起&lt;/span&gt;&lt;div&gt;&lt;h3&gt;形成专长与国际履历&lt;/h3&gt;&lt;p&gt;在RAG质量、Agent可靠性或复杂交互中选一个专长；18至24个月核实内部调动或海外岗位条件。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;学习资源与可信度&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;沿用2026-11-07核验：A 官方文档或原始公告；B 工程文章或课程；C 视频示范；D 未证实线索。小红书仅提供搜索主题。&lt;/p&gt;&lt;div class=&quot;stack&quot; id=&quot;cr-resources&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;雇主研究与求职筛选&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;&lt;p&gt;优先核实代码评审、后端责任、真实境外研发协作。全球办公室不等于外派承诺。&lt;/p&gt;&lt;div class=&quot;stack&quot; id=&quot;cr-employers&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;备份与恢复进度&lt;/summary&gt;&lt;div class=&quot;inside&quot;&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;备份包含任务修改、笔记和验收记录，不会修改原Word或Excel。可在下载版与聊天版之间复制恢复。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;cr-backup&quot;&gt;生成进度备份&lt;/button&gt;&lt;label class=&quot;form-label&quot;&gt;进度备份文本&lt;textarea class=&quot;form-control&quot; id=&quot;cr-backup-text&quot; rows=&quot;4&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;cr-restore&quot;&gt;恢复这份备份&lt;/button&gt;&lt;p class=&quot;text-small&quot; id=&quot;cr-backup-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
